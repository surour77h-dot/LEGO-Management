<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HSKW LEGO">
<link rel="manifest" href="manifest.json">
<title>HSKW LEGO Collection</title>
<style>
:root{
  --red:#C4151C;--red2:#9B1016;
  --yellow:#FFD700;--yellow2:#B8960A;
  --blue:#006DB7;--blue2:#004A85;
  --green:#00A650;--green2:#006B35;
  --orange:#F47B20;
  --bg:#F4F4EF;--bg2:#FAFAF7;--panel:#fff;
  --border:#DDDDD5;--shadow:0 2px 10px rgba(0,0,0,.09);
  --text:#1A1A1A;--text2:#555;--text3:#999;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;min-height:100vh}
.hdr{background:var(--red);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(196,21,28,.4)}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-brick{width:38px;height:38px;background:var(--yellow);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 0 var(--yellow2)}
.hdr-name{font-size:19px;font-weight:900;color:#fff;letter-spacing:.5px}
.hdr-sub{font-size:9px;color:rgba(255,255,255,.75);letter-spacing:2px;text-transform:uppercase}
.hdr-chips{display:flex;gap:6px}
.chip{background:rgba(255,255,255,.2);color:#fff;padding:3px 9px;border-radius:16px;font-size:11px;font-weight:700}
.tabs-wrap{background:var(--blue);border-bottom:3px solid var(--blue2)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;font-size:13px;font-weight:700;color:rgba(255,255,255,.65);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-3px;transition:all .15s}
.tab.on{color:var(--yellow);border-bottom-color:var(--yellow)}
.content{padding:12px}
.toolbar{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.sbox{flex:1;min-width:160px;display:flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px}
.sbox:focus-within{border-color:var(--blue)}
.sbox input{flex:1;border:none;background:none;font-size:14px;color:var(--text);outline:none}
.btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:800;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn-r{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}
.btn-r:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}
.btn-b{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue2)}
.btn-g{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green2)}
.btn-y{background:var(--yellow);color:#333;box-shadow:0 3px 0 var(--yellow2)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-ghost{background:#eee;color:#555}
.btn-danger{background:#FFE8E8;color:var(--red);border:1px solid #FFAAAA}
.filters{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.fsel{background:var(--panel);border:1.5px solid var(--border);color:var(--text);padding:7px 9px;border-radius:var(--radius-sm);font-size:13px;outline:none;flex:1;min-width:110px}
.fsel:focus{border-color:var(--blue)}
.stats{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;flex:1;min-width:80px;text-align:center}
.stat .sv{font-size:19px;font-weight:900;color:var(--red)}
.stat .sl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--panel);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:linear-gradient(135deg,var(--red),var(--red2))}
thead th{padding:9px 9px;text-align:right;font-weight:800;color:#fff;white-space:nowrap;font-size:11.5px;border-bottom:3px solid var(--yellow);cursor:pointer;user-select:none}
thead th:hover{background:rgba(255,255,255,.1)}
.sort-arrow{font-size:10px;margin-right:3px}
tbody tr{border-bottom:1px solid #EBEBEB;cursor:pointer;transition:background .1s}
tbody tr:hover{background:#FFF8E1!important}
tbody tr:nth-child(even){background:#FAFAF8}
tbody td{padding:7px 9px;white-space:nowrap}
.td-num{color:var(--text3);font-size:11px}
.badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:11px;font-weight:800}
.b-open{background:#DCF5DC;color:#006B35;border:1px solid #90DBA0}
.b-sealed{background:#E8F0FB;color:var(--blue2);border:1px solid #90B4E0}
.b-glued{background:#FFF3CD;color:#856404;border:1px solid var(--yellow)}
.pag{display:flex;justify-content:space-between;align-items:center;margin-top:9px;flex-wrap:wrap;gap:7px;font-size:12px;color:var(--text2)}
.pag-btns{display:flex;gap:4px}
.pgb{background:var(--panel);border:1.5px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.pgb.on{background:var(--red);color:#fff;border-color:var(--red)}
.pgb:disabled{opacity:.35;cursor:not-allowed}

/* DETAIL MODAL */
/* Default (portrait / phone): bottom sheet */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center}
.mbg.open{display:flex}
.modal{background:var(--panel);width:100%;max-width:600px;max-height:93vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -4px 30px rgba(0,0,0,.25);animation:suP .22s ease}
@keyframes suP{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:38px;height:4px;background:#DDD;border-radius:2px;margin:10px auto 6px;flex-shrink:0}
/* header */
.mhdr{background:var(--red);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.mhdr-left{flex:1;min-width:0}
.mhdr-title{color:#fff;font-size:15px;font-weight:900;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhdr-num{color:var(--yellow);font-size:11px;font-weight:700;margin-top:2px}
.mhdr-n2{background:rgba(255,255,255,.22);color:#fff;padding:3px 9px;border-radius:16px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}
.mclose{background:rgba(255,255,255,.22);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* modal body layout: column by default */
.modal-inner{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.mbody-col{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* CAROUSEL – portrait */
.car-wrap{background:#fff;border-bottom:2px solid var(--border);flex-shrink:0;position:relative;height:260px}
.car-viewport{width:100%;height:100%;overflow:hidden;position:relative}
.car-track{display:flex;height:100%;transition:transform .32s cubic-bezier(.4,0,.2,1);will-change:transform}
.car-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;padding:12px;flex-shrink:0}
.car-slide img{max-height:100%;max-width:100%;object-fit:contain;display:block}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.22);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;line-height:1}
.car-prev{left:7px}.car-next{right:7px}
.car-dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5}
.cdot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18);cursor:pointer;transition:background .2s;border:1.5px solid rgba(255,255,255,.6)}
.cdot.on{background:var(--red);border-color:var(--red)}
/* detail body */
.mbody{padding:12px 16px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.di{background:var(--bg2);border-radius:var(--radius-sm);padding:9px 11px}
.di.full{grid-column:1/-1}
.di.sm{padding:6px 9px}
.dl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;font-weight:700}
.dv{font-size:14px;font-weight:700;color:var(--text)}
.dv a{color:var(--blue);text-decoration:none}
.di-green{background:#E8F8EE}.dv-green{color:var(--green2)!important;font-size:15px}
.di-pink{background:#FFE8E8}.dv-pink{color:#7B000A!important;font-size:15px}
.mactions{display:flex;gap:8px;padding:0 16px;margin-top:4px;flex-shrink:0;padding-bottom:6px}

/* ── LANDSCAPE / DESKTOP (iPad horizontal, laptop) ── */
@media (min-width:700px) and (orientation:landscape),
       (min-width:900px){
  .mbg{align-items:center}
  .modal{
    border-radius:var(--radius);
    max-width:920px;
    width:95vw;
    max-height:88vh;
    animation:suL .2s ease;
  }
  @keyframes suL{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  .mhandle{display:none}
  .modal-inner{flex-direction:row;flex:1;min-height:0;overflow:hidden}
  /* Image on the RIGHT, data on the LEFT */
  .car-wrap{
    order:2;
    width:45%;
    min-width:340px;
    height:auto;
    border-bottom:none;
    border-left:2px solid var(--border);
    flex-shrink:0;
  }
  .car-slide{min-height:420px}
  .mbody-col{order:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
}

/* FORM MODAL */
.fbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;align-items:center;justify-content:center;padding:14px}
.fbg.open{display:flex}
.fmodal{background:var(--panel);border-radius:var(--radius);width:100%;max-width:540px;max-height:91vh;overflow-y:auto;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.2);border-top:5px solid var(--red)}
.fmodal h2{font-size:15px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;color:var(--red)}
.fclose{background:none;border:none;font-size:19px;cursor:pointer;color:var(--text3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:var(--blue)}
.factions{display:flex;gap:9px;margin-top:13px;justify-content:flex-end}

/* BILLS */
.bill-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.bcard{background:var(--panel);border-radius:var(--radius-sm);padding:11px;border:1.5px solid var(--border);text-align:center}
.bcard .bv{font-size:21px;font-weight:900;color:var(--blue)}
.bcard .bl{font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.bill-card{background:var(--panel);border-radius:var(--radius);border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.bill-card-hdr{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.bill-card-hdr .bdate{color:#fff;font-weight:800;font-size:14px}
.bill-card-hdr .bamt{color:var(--yellow);font-weight:900;font-size:16px}
.bill-card-body{padding:10px 14px}
.bill-item-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #F0F0F0;cursor:pointer;transition:background .1s;border-radius:4px}
.bill-item-row:hover{background:#F0F7FF}
.bill-item-row:last-child{border-bottom:none}
.bill-actions{display:flex;gap:6px;padding:8px 14px;border-top:1px solid #F0F0F0;background:#FAFAF8}

/* BILL DETAIL (full page) */
.bill-detail-wrap{background:var(--panel);border-radius:var(--radius);border:1.5px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.bill-detail-store-hdr{padding:24px 20px 16px;text-align:center}
.bill-detail-store-name{font-size:28px;font-weight:900;color:#fff;margin-bottom:4px}
.bill-detail-date{font-size:14px;color:rgba(255,255,255,.8);font-weight:600}
.bill-detail-total{font-size:22px;font-weight:900;color:var(--yellow);margin-top:8px}
.bill-detail-items{padding:14px}
.bill-detail-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .1s;background:var(--bg2)}
.bill-detail-item:hover{background:#EFF7FF;border-color:var(--blue)}
.bill-detail-back{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;color:var(--blue);cursor:pointer;font-size:14px}

/* DASHBOARD */
.dash-section{background:var(--panel);border-radius:var(--radius);padding:13px;margin-bottom:11px;border:1.5px solid var(--border)}
.dash-title{font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.theme-bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.theme-bar-track{flex:1;background:#eee;border-radius:4px;height:8px;overflow:hidden}
.theme-bar-fill{height:100%;border-radius:4px}
.dtog{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--text2);transition:all .15s}
.dtog.on{border-color:currentColor}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:28px;font-weight:800;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.sc,.tc{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}

@media(max-width:480px){
  .dgrid{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .fg.full{grid-column:1}
  .bill-summary{grid-template-columns:1fr 1fr}
}
</style>
</head>

</div>

<!-- SET FORM MODAL -->
<div class="fbg" id="FM">
  <div class="fmodal">
    <h2 id="FT">Add Set <button class="fclose" onclick="cForm()">✕</button></h2>

  </div>
</div>

<!-- BILL FORM MODAL -->
<div class="fbg" id="BFM">
  <div class="fmodal">
    <h2 id="BFT">Add Bill <button class="fclose" onclick="cBillForm()">✕</button></h2>
    <div id="BFB"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

function fn(v){if(v===null||v===undefined||v==='')return'—';const n=parseFloat(v);return isNaN(n)?v:n%1===0?n.toLocaleString():n.toFixed(2);}
function fd(v){if(!v)return'—';const s=String(v);return s.match(/^\d{4}-\d{2}-\d{2}/)?s.substring(0,10):s;}
function toast(m,err=false){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2200);}
function sc(v){if(!v)return'';const c=SC[v]||{bg:'#888',c:'#fff'};return`<span class="sc" style="background:${c.bg};color:${c.c}">${v}</span>`;}
function tc(v){if(!v)return'';const c=TC[v]||{bg:'#607D8B',c:'#fff'};return`<span class="tc" style="background:${c.bg};color:${c.c}">${v}</span>`;}
function openBadge(open,n2){

function openDetail(id){
  const r=S.rows.find(x=>x._id===id);
  if(!r)return;
  document.getElementById('DT').textContent=r['item Name']||'';
  document.getElementById('DN').textContent=`Item # ${r['item #']}`;
  document.getElementById('DN2').textContent=`# ${r.N2}`;
  // ── IMAGE CAROUSEL ─────────────────────────────────────
  (function(){
    const num = r['item #'];
    const nm  = (r['item Name']||'').replace(/"/g,"'");
    // Multiple official URL patterns - browser img tags bypass CORS
    // Tried in order: Brickset main, Rebrickable, BrickLink box, BrickLink set
    const allSrcs = [
      `https://images.brickset.com/sets/images/${num}-1.jpg`,
      `https://cdn.rebrickable.com/media/sets/${num}-1.jpg`,
      `https://img.bricklink.com/ItemImage/ON/0/${num}-1.png`,
      `https://img.bricklink.com/ItemImage/SL/0/${num}-1.png`,
      `https://images.brickset.com/sets/images/${num}-1_HighRes.jpg`,
      `https://images.brickset.com/sets/AdditionalImages/${num}-1/image2.jpg`,
    ];
    let loaded = [];   // indices into allSrcs that loaded successfully
    let cur = 0;       // index within loaded[]

    function buildUI(){
      const slides = allSrcs.map((src,i) =>
        `<div class="car-slide" id="csl_${i}" style="display:none">` +
        `<img src="${src}" alt="${nm}" ` +
        `onload="window.__imgOK(${i})" ` +
        `onerror="window.__imgFail(${i})">` +
        `</div>`
      ).join('');
      document.getElementById('DI').innerHTML =
        `<div class="car-viewport"><div class="car-track" id="ctrack_${num}">${slides}</div></div>` +
        `<button class="car-btn car-prev" onclick="event.stopPropagation();__carGo(-1)">‹</button>` +
        `<button class="car-btn car-next" onclick="event.stopPropagation();__carGo(1)">›</button>` +
        `<div class="car-dots" id="cdots_${num}"></div>` +
        `<div id="car_placeholder" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">` +
        `<div style="text-align:center;opacity:.25"><div style="font-size:48px">🧱</div><div style="font-size:11px;color:#999;margin-top:4px">${nm}</div></div></div>`;
    }

    function updateDots(){
      const dotsEl = document.getElementById('cdots_${num}');
      if(!dotsEl) return;
      dotsEl.innerHTML = loaded.map((_,j) =>
        `<div class="cdot${j===cur?' on':''}" onclick="__carSetJ(${j})"></div>`
      ).join('');
    }

    function showSlide(j){
      cur = j;
      const track = document.getElementById('ctrack_${num}');
      if(!track) return;
      // Reorder track children to match loaded[]
      loaded.forEach((srcIdx,k) => {
        const sl = document.getElementById('csl_'+srcIdx);
        if(sl){ sl.style.display=''; track.appendChild(sl); }
      });
      track.style.transform = `translateX(${j*100}%)`;
      updateDots();
    }

    window.__imgOK = function(i){
      const ph = document.getElementById('car_placeholder');
      if(ph) ph.style.display='none';
      if(!loaded.includes(i)){ loaded.push(i); loaded.sort((a,b)=>a-b); }
      if(loaded.length===1) showSlide(0);
      else updateDots();
    };
    window.__imgFail = function(i){
      const sl = document.getElementById('csl_'+i);
      if(sl) sl.style.display='none';
    };
    window.__carGo = function(d){
      if(!loaded.length) return;
      showSlide((cur+d+loaded.length)%loaded.length);
    };
    window.__carSetJ = function(j){
      showSlide(j);
    };

    // Touch/swipe support
    let tx=0;
    window.__carSwipeStart = function(e){ tx=e.touches[0].clientX; };
    window.__carSwipeEnd   = function(e){
      const dx=e.changedTouches[0].clientX-tx;
      if(Math.abs(dx)>40) __carGo(dx<0?1:-1);
    };

    buildUI();

    // Add swipe listeners to carousel
    setTimeout(()=>{
      const vp=document.querySelector('.car-viewport');
      if(vp){
        vp.addEventListener('touchstart',e=>window.__carSwipeStart(e),{passive:true});
        vp.addEventListener('touchend',  e=>window.__carSwipeEnd(e),  {passive:true});
      }
    },100);
  })();
  const pBuy=parseFloat(r['Price BUY'])||0;
  const pOrig=parseFloat(r.Price)||0;
  const origHigher=pOrig>pBuy, origEq=Math.abs(pOrig-pBuy)<0.001;
  const pct=r['%']!==null&&r['%']!==undefined?Math.round(parseFloat(r['%'])*100)+'%':'—';
  const myLink=r.Link||legoUrl(r['item #']);
  const dup=DUPES.has(r['item #']);
  document.getElementById('DB').innerHTML=`
    <div class="dgrid">
      <div class="di"><div class="dl">Status</div><div class="dv">${openBadge(r.Open,r.N2)}</div></div>
      <div class="di"><div class="dl">Theme</div><div class="dv">${tc(r.theme)}</div></div>
      <div class="di full"><div class="dl">Sub Theme</div><div class="dv" style="font-size:13px">${r.subTheme||'—'}</div></div>
      <div class="di"><div class="dl">Pieces</div><div class="dv" style="color:var(--blue);font-size:18px">${r.PCS||'—'}</div></div>
      <div class="di"><div class="dl">Store</div><div class="dv">${sc(r.STORE)}</div></div>
      <div class="di ${origHigher?'di-pink':''}" style="${origEq?'':''}"><div class="dl">Original Price</div><div class="dv ${origHigher?'dv-pink':'dv-normal'}">${fn(r.Price)} KWD</div></div>
      <div class="di di-green"><div class="dl">Price Buy</div><div class="dv dv-green">${fn(r['Price BUY'])} KWD</div></div>
      <div class="di sm"><div class="dl">Discount</div><div class="dv" style="font-size:13px">${pct}</div></div>
      <div class="di sm"><div class="dl">Box</div><div class="dv" style="font-size:13px">${r.Box||'—'}</div></div>
      <div class="di sm"><div class="dl">Total Bill</div><div class="dv" style="font-size:12px;color:var(--red)">${fn(r['Total Bill'])}</div></div>
      <div class="di sm"><div class="dl">The Price</div><div class="dv" style="font-size:12px;color:#888">${fn(r['The Price'])}</div></div>
      <div class="di"><div class="dl">Order Date</div><div class="dv">${fd(r['Order Date'])}</div></div>
      ${dup?`<div class="di full" style="background:#FFE0E0;border:1px solid #FFAAAA"><div class="dl">⚠️</div><div class="dv" style="color:#8B0000;font-size:13px">Duplicate Item Number</div></div>`:''}
    </div>`;
  document.getElementById('DA').innerHTML=`
    <button class="btn btn-b" style="flex:1" onclick="window.open('${myLink}','_blank')">📋 My Collection</button>
    <button class="btn btn-r" style="flex:1" onclick="window.open('${legoUrl(r['item #'])}','_blank')">🌐 LEGO Page</button>
    <button class="btn btn-y btn-sm" onclick="cDetail();openEdit(${id})">✏️</button>
    <button class="btn btn-danger btn-sm" onclick="cDetail();deleteRow(${id})">🗑</button>`;
  document.getElementById('DM').classList.add('open');
}

  S.rows=S.rows.filter(r=>r._id!==id);

      <div class="fg"><label>Date</label><input type="date" id="bfDt" value="${b.date||''}"></div>
      <div class="fg"><label>Store</label><select id="bfSt">${storeOpts}</select></div>
      <div class="fg"><label>Total Bill (KWD)</label><input type="number" step=".001" id="bfAmt" value="${b.total_bill||''}"></div>
      <div class="fg full"><label>Item Numbers (comma separated)</label><input type="text" id="bfItems" value="${itemsStr}" placeholder="41339, 21028, ..."></div>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">Tip: item names will be auto-filled from your collection</div>
    <div class="factions">
      <button class="btn btn-ghost btn-sm" onclick="cBillForm()">Cancel</button>
      <button class="btn btn-r" onclick="saveBill()">💾 Save</button>
    </div>`;
}

function saveBill(){
  const dt=document.getElementById('bfDt').value;
  const st=document.getElementById('bfSt').value;
  const amt=parseFloat(document.getElementById('bfAmt').value)||0;
  const nums=document.getElementById('bfItems').value.split(',').map(s=>s.trim()).filter(Boolean).map(Number);
  const items=nums.map(num=>{
    const row=S.rows.find(r=>r['item #']===num);
    return{n2:row?.N2||null,item_num:num,name:row?.['item Name']||'Unknown',price_buy:row?.['Price BUY']||null};
  });
  const bill={date:dt,total_bill:amt,store:st,items,_bid:Date.now()};
  if(S._editBillIdx!=null){S.bills[S._editBillIdx]={...bill};toast('✅ Bill updated!');}
  else{S.bills.unshift(bill);toast('✅ Bill added!');}
  cBillForm();renderBills();
}

// ── DASHBOARD ────────────────────────────────────────────
function renderDash(){
  const hide=S.dashHide;
  let rows=[...S.rows];
  if(hide.has('glued'))rows=rows.filter(r=>!(r.N2>=2&&r.N2<=97));
  if(hide.has('open'))rows=rows.filter(r=>r.Open!=='Open');
  if(hide.has('sealed'))rows=rows.filter(r=>!((!r.Open)&&r.N2>97));
  // dup filter removed

  // Spend from row 98+
  const spendRows=rows.filter(r=>r.N2>=98);
  const totalSpend=spendRows.reduce((a,r)=>a+(parseFloat(r['Price BUY'])||0),0);

  const themeCounts={};
  rows.forEach(r=>{const t=r.theme;if(t)themeCounts[t]=(themeCounts[t]||0)+1});
  const sortedT=Object.entries(themeCounts).sort((a,b)=>b[1]-a[1]);
  const maxT=sortedT[0]?.[1]||1;
  const storeCounts={};
  rows.forEach(r=>{const s=r.STORE;if(s)storeCounts[s]=(storeCounts[s]||0)+1});
  const sortedS=Object.entries(storeCounts).sort((a,b)=>b[1]-a[1]);

  const cats=[
    {k:'open',l:'🔓 Open',col:'var(--green)',cnt:S.rows.filter(r=>r.Open==='Open').length},
    {k:'sealed',l:'🔒 Sealed',col:'var(--blue)',cnt:S.rows.filter(r=>!r.Open&&r.N2>97).length},
    {k:'glued',l:'✳️ Glued',col:'#856404',cnt:S.rows.filter(r=>r.N2>=2&&r.N2<=97).length},
  ];

  document.getElementById('C').innerHTML=`
    <div class="dash-section">
      <div class="dash-title" style="color:var(--red)">🎛 Filters — Showing ${rows.length} / ${S.rows.length} sets</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px">
        ${cats.map(cat=>`
          <div style="display:flex;flex-direction:column;gap:2px">
            <div class="dtog ${!hide.has(cat.k)?'on':''}" style="color:${cat.col};border-color:${!hide.has(cat.k)?cat.col:'var(--border)'}" onclick="S.dashHide.has('${cat.k}')?S.dashHide.delete('${cat.k}'):S.dashHide.add('${cat.k}');renderDash()">
              ${!hide.has(cat.k)?'✓ ':''}${cat.l} (${cat.cnt})
            </div>
            ${cat.tip?`<span style="font-size:10px;color:var(--text3);padding-right:2px">${cat.tip}</span>`:''}
          </div>`).join('')}
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="sv">${rows.length}</div><div class="sl">Sets</div></div>
      <div class="stat"><div class="sv">${totalSpend.toFixed(1)}</div><div class="sl">KWD (from #98)</div></div>
    </div>
    <div class="dash-section">
      <div class="dash-title" style="color:var(--blue)">🎨 By Theme</div>
      ${sortedT.map(([t,c])=>`
        <div class="theme-bar-row">
          <span style="min-width:130px;font-size:12px">${tc(t)}</span>
          <div class="theme-bar-track"><div class="theme-bar-fill" style="width:${Math.round(c/maxT*100)}%;background:${(TC[t]||{bg:'#888'}).bg}"></div></div>
          <span style="font-weight:800;font-size:12px;min-width:22px;text-align:right;color:var(--red)">${c}</span>
        </div>`).join('')}
    </div>
    <div class="dash-section">
      <div class="dash-title" style="color:var(--green)">🏪 By Store</div>
      ${sortedS.map(([s,c])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #F0F0F0">
          ${sc(s)}<span style="font-weight:800;color:var(--text2)">${c} sets</span>
        </div>`).join('')}
    </div>`;
}

function exportCSV(){
  const h=COLS.join(',');
  const r=S.rows.map(r=>COLS.map(c=>`"${String(r[c]||'').replace(/"/g,'""')}"`).join(','));
  const b=new Blob([[h,...r].join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='HSKW_LEGO.csv';a.click();
  toast('📥 Exported!');
}

document.getElementById('DM').addEventListener('click',e=>{if(e.target===document.getElementById('DM'))cDetail()});
document.getElementById('FM').addEventListener('click',e=>{if(e.target===document.getElementById('FM'))cForm()});
document.getElementById('BFM').addEventListener('click',e=>{if(e.target===document.getElementById('BFM'))cBillForm()});
render();
</script>
</body>
</html>
