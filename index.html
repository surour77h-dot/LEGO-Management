<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HMD LEGO Collection</title>
  <meta name="theme-color" content="#FFD500" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-brick">LEGO</div>
        <div><h1>HMD LEGO</h1><p>Collection Manager</p></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-card">
        <strong>استيراد Excel</strong>
        <span>يحدّث الصفحات حسب أسماء الشيتات.</span>
        <label class="import-btn">اختر ملف Excel<input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm" hidden /></label>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <span class="eyebrow">نسخة بتصميم LEGO</span>
          <h2 id="pageTitle">Owned</h2>
        </div>
        <div class="top-actions">
          <input id="search" placeholder="بحث سريع…" />
          <button id="addBtn" class="primary">+ إضافة لعبة</button>
        </div>
      </header>
      <section class="kpis" id="kpis"></section>
      <section class="table-card">
        <div class="table-head"><h3 id="tableTitle">البيانات</h3><span id="recordCount"></span></div>
        <div class="table-wrap"><table id="dataTable"></table></div>
      </section>
    </main>
  </div>
  <dialog id="formDialog">
    <form method="dialog" id="entryForm">
      <div class="dialog-head"><h3>إضافة / تعديل بيانات Owned</h3><button value="cancel" type="submit">×</button></div>
      <div class="form-grid" id="formFields"></div>
      <menu><button value="cancel">إلغاء</button><button id="saveEntry" value="default" class="primary">حفظ</button></menu>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
