<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>HSKW LEGO Collection</title>
<style>
:root {
  --lego-red: #C4151C;
  --lego-yellow: #FFD700;
  --lego-blue: #006DB7;
  --lego-green: #00A650;
  --lego-white: #FFFFFF;
  --lego-orange: #F47B20;
  --lego-dark-red: #8B0000;
  
  --bg: #F5F5F0;
  --bg2: #FFFFFF;
  --bg3: #EFEFEA;
  --panel: #FFFFFF;
  --border: #D0CFC8;
  --text: #1A1A1A;
  --text2: #555550;
  --text3: #888880;
  --shadow: 0 2px 8px rgba(0,0,0,0.10);
  --radius: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }

/* ── HEADER ── */
.header {
  background: var(--lego-red);
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 3px 10px rgba(196,21,28,0.4);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-brick {
  width: 40px; height: 40px; background: var(--lego-yellow);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; box-shadow: 0 3px 0 #B8960A;
}
.logo-text { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
.logo-sub { font-size: 10px; color: rgba(255,255,255,0.8); letter-spacing: 2px; text-transform: uppercase; }
.header-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-chip {
  background: rgba(255,255,255,0.2); color: #fff;
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
}

/* ── NAV TABS ── */
.nav-tabs-wrap { background: var(--lego-blue); border-bottom: 3px solid #004A85; }
.nav-tabs { display: flex; overflow-x: auto; scrollbar-width: none; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 10px 18px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.7);
  border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; transition: all 0.2s;
  margin-bottom: -3px;
}
.nav-tab.active { color: var(--lego-yellow); border-bottom-color: var(--lego-yellow); }

/* ── CONTENT ── */
.content { padding: 14px; }

/* ── TOOLBAR ── */
.toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.search-box {
  flex: 1; min-width: 180px;
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 2px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px;
}
.search-box:focus-within { border-color: var(--lego-blue); }
.search-box input { flex: 1; border: none; background: none; font-size: 14px; color: var(--text); outline: none; }
.btn {
  padding: 9px 16px; border-radius: var(--radius-sm); font-size: 13px;
  font-weight: 800; cursor: pointer; border: none; transition: all 0.15s;
  white-space: nowrap; display: flex; align-items: center; gap: 5px;
}
.btn-red { background: var(--lego-red); color: #fff; box-shadow: 0 3px 0 #8B0F14; }
.btn-red:active { transform: translateY(2px); box-shadow: 0 1px 0 #8B0F14; }
.btn-blue { background: var(--lego-blue); color: #fff; box-shadow: 0 3px 0 #004A85; }
.btn-blue:active { transform: translateY(2px); box-shadow: 0 1px 0 #004A85; }
.btn-green { background: var(--lego-green); color: #fff; box-shadow: 0 3px 0 #006B35; }
.btn-yellow { background: var(--lego-yellow); color: #333; box-shadow: 0 3px 0 #B8960A; }
.btn-sm { padding: 6px 12px; font-size: 12px; }

/* ── FILTERS ── */
.filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.filter-sel {
  background: var(--panel); border: 1.5px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: var(--radius-sm);
  font-size: 13px; outline: none; flex: 1; min-width: 120px;
}
.filter-sel:focus { border-color: var(--lego-blue); }

/* ── STATS ROW ── */
.stats-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.mini-stat {
  background: var(--panel); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px; flex: 1; min-width: 100px;
  text-align: center;
}
.mini-stat .sv { font-size: 20px; font-weight: 900; color: var(--lego-red); }
.mini-stat .sl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

/* ── TABLE ── */
.table-outer { overflow-x: auto; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--panel); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead tr { background: linear-gradient(135deg, var(--lego-red), #9B1016); }
thead th {
  padding: 10px 10px; text-align: right; font-weight: 800;
  color: #fff; white-space: nowrap; font-size: 11.5px;
  border-bottom: 3px solid var(--lego-yellow);
}
tbody tr { border-bottom: 1px solid #EBEBEB; cursor: pointer; transition: background 0.12s; }
tbody tr:hover { background: #FFF8E1 !important; }
tbody tr:nth-child(even) { background: #FAFAF8; }
tbody td { padding: 8px 10px; white-space: nowrap; font-size: 12.5px; }
.td-num { color: var(--text3); font-size: 11px; }

/* ── BADGES / CHIPS ── */
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 800; }
.badge-open { background: #DCF5DC; color: #006B35; border: 1px solid #90DBA0; }
.badge-sealed { background: #E8F0FB; color: #004A85; border: 1px solid #90B4E0; }
.badge-glued { background: #FFF3CD; color: #856404; border: 1px solid #FFD700; }
.badge-dup { background: #FFE0E0; color: #8B0000; }

/* Store color chips */
.store-chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

/* Theme color chips */
.theme-chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

/* ── PAGINATION ── */
.pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--text2); }
.page-btns { display: flex; gap: 5px; }
.pg-btn {
  background: var(--panel); border: 1.5px solid var(--border);
  color: var(--text); padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700;
}
.pg-btn.active { background: var(--lego-red); color: #fff; border-color: var(--lego-red); }
.pg-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── DETAIL MODAL ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 300;
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--panel); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 600px; max-height: 92vh;
  overflow-y: auto; padding: 0 0 30px;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 40px; height: 4px; background: #DDD; border-radius: 2px; margin: 12px auto 8px; }
.modal-header { background: var(--lego-red); padding: 14px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
.modal-title { color: #fff; font-size: 16px; font-weight: 900; flex: 1; line-height: 1.3; }
.modal-item-num { color: var(--lego-yellow); font-size: 13px; font-weight: 700; margin-top: 3px; }
.modal-close { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.modal-img-wrap { background: #F8F8F8; height: 200px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--border); }
.modal-img { max-height: 190px; max-width: 100%; object-fit: contain; }
.modal-img-placeholder { font-size: 60px; opacity: 0.2; }

.modal-body { padding: 16px 20px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.detail-item { background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 12px; }
.detail-item.full { grid-column: 1 / -1; }
.detail-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; font-weight: 700; }
.detail-value { font-size: 14px; font-weight: 700; color: var(--text); }
.detail-value a { color: var(--lego-blue); text-decoration: none; font-size: 13px; }
.modal-actions { display: flex; gap: 10px; padding: 0 20px; }

/* ── FORM MODAL ── */
.form-modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 400;
  align-items: center; justify-content: center; padding: 16px;
}
.form-modal-bg.open { display: flex; }
.form-modal {
  background: var(--panel); border-radius: var(--radius);
  width: 100%; max-width: 540px; max-height: 90vh;
  overflow-y: auto; padding: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  border-top: 5px solid var(--lego-red);
}
.form-modal h2 { font-size: 16px; font-weight: 900; margin-bottom: 16px; display: flex; justify-content: space-between; color: var(--lego-red); }
.form-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text3); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg.full { grid-column: 1 / -1; }
.fg label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; }
.fg input, .fg select, .fg textarea {
  background: var(--bg3); border: 1.5px solid var(--border);
  color: var(--text); padding: 9px 10px; border-radius: var(--radius-sm);
  font-size: 13px; outline: none; font-family: inherit;
}
.fg input:focus, .fg select:focus { border-color: var(--lego-blue); }
.fg textarea { resize: vertical; min-height: 60px; }
.form-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }

/* ── BILLS TABLE ── */
.bills-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.bill-card { background: var(--panel); border-radius: var(--radius-sm); padding: 12px; border: 1.5px solid var(--border); text-align: center; }
.bill-card .bv { font-size: 22px; font-weight: 900; color: var(--lego-blue); }
.bill-card .bl { font-size: 10px; color: var(--text3); text-transform: uppercase; margin-top: 2px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--lego-green); color: #fff; padding: 11px 22px;
  border-radius: 30px; font-weight: 800; font-size: 13px;
  z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  box-shadow: 0 4px 15px rgba(0,166,80,0.4);
}
.toast.show { opacity: 1; }
.toast.err { background: var(--lego-red); box-shadow: 0 4px 15px rgba(196,21,28,0.4); }

/* Lego brick decoration */
.brick-dots { display: flex; gap: 3px; }
.brick-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); }

@media (max-width: 500px) {
  .detail-grid { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .fg.full { grid-column: 1; }
  .bills-summary { grid-template-columns: 1fr 1fr; }
}
</style>

// ── HELPERS ───────────────────────────────────────────────
function fmtNum(v) {
  if (v===null||v===undefined||v==='') return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n%1===0 ? n.toLocaleString() : n.toFixed(2);
}
function fmtDate(v) {
  if (!v) return '—';
  const s = String(v);
  if (s.match(/^\d{4}-\d{2}-\d{2}/)) return s.substring(0,10);
  return s;
}
function legoUrl(itemNum) {
  return `https://www.lego.com/en-us/product/${itemNum}`;
}
function imgUrl(itemNum) {
  return `https://www.lego.com/cdn/cs/set/assets/blt${itemNum}/product-image.jpg`;
}
function bricksetImg(itemNum) {
  return `https://images.brickset.com/sets/images/${itemNum}-1.jpg`;
}
function toast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  setTimeout(()=>t.className='toast', 2200);
}

function storeChip(v) {
  if (!v) return '';
  const c = STORE_COLORS[v] || {bg:'#888', color:'#fff'};
  return `<span class="store-chip" style="background:${c.bg};color:${c.color}">${v}</span>`;
}
function themeChip(v) {
  if (!v) return '';
  const c = THEME_COLORS[v] || {bg:'#607D8B', color:'#fff'};
  return `<span class="theme-chip" style="background:${c.bg};color:${c.color}">${v}</span>`;
}
function openBadge(v, n2) {
  if (n2 >= 2 && n2 <= 97) return `<span class="badge badge-glued">✳️ Glued</span>`;
  if (v === 'Open') return `<span class="badge badge-open">🔓 Open</span>`;
  return `<span class="badge badge-sealed">🔒 Sealed</span>`;
}

// ── TABS ──────────────────────────────────────────────────
function switchTab(tab) {
  S.tab = tab; S.page = 1; S.search = ''; S.filterTheme = ''; S.filterStore = ''; S.filterOpen = '';
  ['everything','bills','dashboard'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  render();
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  if (S.tab === 'everything') renderEverything();
  else if (S.tab === 'bills') renderBills();
  else renderDashboard();
}

function renderEverything() {
  let rows = S.rows;
  if (S.search) {
    const q = S.search.toLowerCase();
    rows = rows.filter(r => COLS.some(c => String(r[c]||'').toLowerCase().includes(q)));
  }
  if (S.filterTheme) rows = rows.filter(r => r['theme'] === S.filterTheme);
  if (S.filterStore) rows = rows.filter(r => r['STORE'] === S.filterStore);
  if (S.filterOpen === 'open') rows = rows.filter(r => r['Open']==='Open');
  else if (S.filterOpen === 'sealed') rows = rows.filter(r => !r['Open'] && (r['N2']>97));
  else if (S.filterOpen === 'glued') rows = rows.filter(r => r['N2']>=2 && r['N2']<=97);

  const total = rows.length;
  const pages = Math.ceil(total/S.pageSize)||1;
  if (S.page>pages) S.page=1;
  const start = (S.page-1)*S.pageSize;
  const paged = rows.slice(start, start+S.pageSize);

  // Unique filters
  const themes = [...new Set(S.rows.map(r=>r['theme']).filter(Boolean))].sort();
  const stores = [...new Set(S.rows.map(r=>r['STORE']).filter(Boolean))].sort();

  // Stats
  const totalSpend = S.rows.reduce((a,r)=>a+(parseFloat(r['Total Bill'])||0),0);
  document.getElementById('hdr-count').textContent = S.rows.length + ' sets';
  document.getElementById('hdr-spend').textContent = totalSpend.toFixed(1) + ' KWD';

  document.getElementById('mainContent').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="بحث في الكولكشن..." value="${S.search}" oninput="S.search=this.value;S.page=1;render()">
      </div>
      <button class="btn btn-red" onclick="openAdd()">＋ Add</button>
      <button class="btn btn-green btn-sm" onclick="exportXLSX()">⬇ Export</button>
    </div>
    <div class="filters">
      <select class="filter-sel" onchange="S.filterTheme=this.value;S.page=1;render()">
        <option value="">🎨 All Themes</option>
        ${themes.map(t=>`<option value="${t}" ${S.filterTheme===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <select class="filter-sel" onchange="S.filterStore=this.value;S.page=1;render()">
        <option value="">🏪 All Stores</option>
        ${stores.map(s=>`<option value="${s}" ${S.filterStore===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select class="filter-sel" style="max-width:140px" onchange="S.filterOpen=this.value;S.page=1;render()">
        <option value="">📦 All Status</option>
        <option value="open" ${S.filterOpen==='open'?'selected':''}>🔓 Open</option>
        <option value="sealed" ${S.filterOpen==='sealed'?'selected':''}>🔒 Sealed</option>
        <option value="glued" ${S.filterOpen==='glued'?'selected':''}>✳️ Glued</option>
      </select>
      ${S.search||S.filterTheme||S.filterStore||S.filterOpen?`<button class="btn btn-sm" style="background:#eee;color:#333" onclick="S.search='';S.filterTheme='';S.filterStore='';S.filterOpen='';render()">✕ Clear</button>`:''}
    </div>
    <div class="stats-row">
      <div class="mini-stat"><div class="sv">${total.toLocaleString()}</div><div class="sl">Results</div></div>
      <div class="mini-stat"><div class="sv">${S.rows.filter(r=>r['Open']==='Open').length}</div><div class="sl">Open</div></div>
      <div class="mini-stat"><div class="sv">${DUPES.size}</div><div class="sl">Duplicates</div></div>
      <div class="mini-stat"><div class="sv">${S.rows.filter(r=>r['N2']>=2&&r['N2']<=97).length}</div><div class="sl">Glued ✳️</div></div>
    </div>
    <div class="table-outer">
      <table>
        <thead><tr>
          <th>#</th><th>Status</th><th>Item #</th><th>Theme</th><th>Item Name</th>
          <th>PCS</th><th>Price Buy</th><th>Price</th><th>Store</th><th>Bill</th><th>Date</th><th>Box</th>
        </tr></thead>
        <tbody>
          ${paged.length===0 ? `<tr><td colspan="12" style="text-align:center;padding:30px;color:#999">No results</td></tr>` :
            paged.map(r => {
              const isDup = DUPES.has(r['item #']);
              const dupStyle = isDup ? 'background:#FFE0E0!important' : '';
              const itemNumStyle = isDup ? 'color:#8B0000;font-weight:900;background:#FFE0E0;padding:2px 6px;border-radius:4px' : 'font-weight:700';
              return `<tr style="${dupStyle}" onclick="openDetail(${r._id})">
                <td class="td-num">${r['N2']||''}</td>
                <td>${openBadge(r['Open'], r['N2'])}</td>

        }).join('')}
        <button class="pg-btn" onclick="S.page++;render()" ${S.page>=pages?'disabled':''}>›</button>
      </div>
      <select class="filter-sel" style="max-width:80px;padding:5px 6px" onchange="S.pageSize=+this.value;S.page=1;render()">
        ${[20,40,80,100].map(n=>`<option ${S.pageSize===n?'selected':''} value="${n}">${n}</option>`).join('')}

    </div>
  `;
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

// ── ADD / EDIT FORM ───────────────────────────────────────
const STORES_LIST = ['LEGO Store','Fantacy World','Jarir Book','BRICKS','Friday Market','Person','( Centerpoint )','LEGO Store Britsh','The Entertainer','The Harry Potter Shop','Virgin','City Center'];
const THEMES_LIST = ['Advanced models','ARCHITECTURE','Architecture','Bionicle','CITY','Classic','CREATOR','Creator','Creator Expert','DC Comics Super Heroes','Disney','Dots','Elves','FRIENDS','Harry Potter','ICONS','Ideas','Jurassic World','Marvel Super Heroes','Minecraft','NINJAGO','Nexo Knights','Pirates','Promotional','STAR WARS','Scooby-Doo','Speed Champions','Super Mario','TECHNIC','The Hobbit','The LEGO Movie','The Lord of the Rings','The Simpsons','Vidiyo'];

function openAdd() {
  S.editId = null;
  document.getElementById('formTitle').innerHTML = '➕ Add New Set <button class="form-close" onclick="closeForm()">✕</button>';
  renderForm({});
  document.getElementById('formModal').classList.add('open');
}
function openEdit(id) {
  S.editId = id;
  const r = S.rows.find(x=>x._id===id);
  document.getElementById('formTitle').innerHTML = '✏️ Edit Set <button class="form-close" onclick="closeForm()">✕</button>';
  renderForm(r);
  document.getElementById('formModal').classList.add('open');
}
function closeForm() { document.getElementById('formModal').classList.remove('open'); }

function renderForm(r) {
  const v = c => r[c]!==null&&r[c]!==undefined?r[c]:'';
  document.getElementById('formBody').innerHTML = `
    <div class="form-grid">
      <div class="fg"><label>N2 (Serial)</label><input type="number" id="f_N2" value="${v('N2')}"></div>
      <div class="fg"><label>Item #</label><input type="number" id="f_item" value="${v('item #')}"></div>
      <div class="fg"><label>Theme</label>
        <select id="f_theme"><option value="${v('theme')}">${v('theme')||'Select...'}</option>
          ${THEMES_LIST.filter(t=>t!==v('theme')).map(t=>`<option value="${t}">${t}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Sub Theme</label><input type="text" id="f_sub" value="${v('subTheme')}"></div>
      <div class="fg full"><label>Item Name</label><input type="text" id="f_name" value="${v('item Name')}"></div>
      <div class="fg"><label>PCS</label><input type="number" id="f_pcs" value="${v('PCS')}"></div>
      <div class="fg"><label>Price Buy (KWD)</label><input type="number" step="0.001" id="f_pricebuy" value="${v('Price BUY')}"></div>
      <div class="fg"><label>Price (KWD)</label><input type="number" step="0.001" id="f_price" value="${v('Price')}"></div>
      <div class="fg"><label>Store</label>
        <select id="f_store"><option value="${v('STORE')}">${v('STORE')||'Select...'}</option>
          ${STORES_LIST.filter(s=>s!==v('STORE')).map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>The Price</label><input type="number" step="0.001" id="f_theprice" value="${v('The Price')}"></div>
      <div class="fg"><label>Total Bill</label><input type="number" step="0.001" id="f_totalbill" value="${v('Total Bill')}"></div>
      <div class="fg"><label>Order Date</label><input type="date" id="f_date" value="${v('Order Date')?.toString().substring(0,10)||''}"></div>
      <div class="fg"><label>Discount %</label><input type="number" step="0.01" id="f_pct" value="${v('%')}"></div>
      <div class="fg"><label>Box</label><input type="text" id="f_box" value="${v('Box')}"></div>
      <div class="fg"><label>Status (Open field)</label>
        <select id="f_open">
          <option value="" ${!v('Open')?'selected':''}>— Sealed / Empty</option>
          <option value="Open" ${v('Open')==='Open'?'selected':''}>Open</option>
          <option value="✳️" ${v('Open')==='✳️'?'selected':''}>✳️ Glued</option>
        </select>
      </div>
      <div class="fg"><label>Link</label><input type="text" id="f_link" value="${v('Link')}"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-sm" style="background:#eee;color:#333" onclick="closeForm()">Cancel</button>
      <button class="btn btn-red" onclick="saveForm()">💾 Save</button>
    </div>`;
}

function saveForm() {
  const get = id => { const el=document.getElementById(id); return el?el.value:null; };
  const num = id => { const v=get(id); return v===''?null:parseFloat(v); };
  
  const rec = {
    'Open': get('f_open')||null,
    'N2': num('f_N2'),
    'item #': num('f_item'),
    'theme': get('f_theme'),
    'subTheme': get('f_sub'),
    'item Name': get('f_name'),
    'PCS': num('f_pcs'),
    'Price BUY': num('f_pricebuy'),
    'Price': num('f_price'),
    'Link': get('f_link'),
    'STORE': get('f_store'),
    'The Price': num('f_theprice'),
    'Total Bill': num('f_totalbill'),
    'Order Date': get('f_date'),
    '%': num('f_pct'),
    'Box': get('f_box'),
  };

  if (S.editId !== null) {
    const idx = S.rows.findIndex(r=>r._id===S.editId);
    if (idx!==-1) { rec._id = S.editId; S.rows[idx] = rec; toast('✅ Updated!'); }
  } else {
    rec._id = S.rows.reduce((m,r)=>Math.max(m,r._id||0),0)+1;
    S.rows.push(rec);
    toast('✅ Added!');
  }
  closeForm();
  render();
}

// ── BILLS ─────────────────────────────────────────────────
function renderBills() {
  document.getElementById('hdr-count').textContent = S.rows.length + ' sets';
  const totalSpend = S.rows.reduce((a,r)=>a+(parseFloat(r['Total Bill'])||0),0);
  document.getElementById('hdr-spend').textContent = totalSpend.toFixed(1) + ' KWD';

  const bills = S.bills.slice(1); // skip header
  const totalBillAmt = bills.reduce((a,r)=>a+(parseFloat(r[2])||0),0);
  const totalItems = bills.reduce((a,r)=>a+(parseInt(r[3])||0),0);

  const stores = {};
  bills.forEach(r => { const s=r[5]; if(s) stores[s]=(stores[s]||0)+(parseFloat(r[2])||0); });

  document.getElementById('mainContent').innerHTML = `
    <div class="bills-summary">
      <div class="bill-card"><div class="bv">${bills.length}</div><div class="bl">Bills</div></div>
      <div class="bill-card"><div class="bv">${totalItems}</div><div class="bl">Items</div></div>
      <div class="bill-card"><div class="bv">${totalBillAmt.toFixed(1)}</div><div class="bl">KWD Total</div></div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:800;color:var(--lego-blue);margin-bottom:8px">🏪 By Store</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${Object.entries(stores).sort((a,b)=>b[1]-a[1]).map(([s,amt])=>`
          <div style="display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:8px;padding:8px 12px;border:1.5px solid var(--border)">
            <span>${storeChip(s)}</span>
            <span style="font-weight:800;color:var(--lego-red)">${amt.toFixed(2)} KWD</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="table-outer">
      <table>
        <thead><tr>
          <th>Date</th><th>Time</th><th>Total Price</th><th>Items</th><th>Type</th><th>Store</th><th>Bill #</th>
        </tr></thead>
        <tbody>
          ${bills.map(r=>`<tr>
            <td>${fmtDate(r[0])}</td>
            <td>${r[1]||'—'}</td>
            <td style="font-weight:800;color:var(--lego-red)">${fmtNum(r[2])} KWD</td>
            <td style="text-align:center;font-weight:700">${r[3]||'—'}</td>
            <td><span style="background:#E8F0FB;color:#006DB7;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">${r[4]||'—'}</span></td>
            <td>${storeChip(r[5])}</td>
            <td style="color:#888;font-size:11px">${r[6]||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

// ── DASHBOARD ─────────────────────────────────────────────
function renderDashboard() {
  document.getElementById('hdr-count').textContent = S.rows.length + ' sets';
  const totalSpend = S.rows.reduce((a,r)=>a+(parseFloat(r['Total Bill'])||0),0);
  document.getElementById('hdr-spend').textContent = totalSpend.toFixed(1) + ' KWD';

  const themeCounts = {};
  S.rows.forEach(r=>{const t=r['theme'];if(t)themeCounts[t]=(themeCounts[t]||0)+1;});
  const sorted = Object.entries(themeCounts).sort((a,b)=>b[1]-a[1]);
  const maxC = sorted[0]?.[1]||1;

  const storeCounts = {};
  S.rows.forEach(r=>{const s=r['STORE'];if(s)storeCounts[s]=(storeCounts[s]||0)+1;});
  const sortedS = Object.entries(storeCounts).sort((a,b)=>b[1]-a[1]);

  const openCount = S.rows.filter(r=>r['Open']==='Open').length;
  const sealedCount = S.rows.filter(r=>!r['Open']&&r['N2']>97).length;
  const gluedCount = S.rows.filter(r=>r['N2']>=2&&r['N2']<=97).length;

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-row">
      <div class="mini-stat"><div class="sv">${S.rows.length}</div><div class="sl">Total Sets</div></div>
      <div class="mini-stat"><div class="sv">${openCount}</div><div class="sl">Open</div></div>
      <div class="mini-stat"><div class="sv">${sealedCount}</div><div class="sl">Sealed</div></div>
      <div class="mini-stat"><div class="sv">${gluedCount}</div><div class="sl">Glued ✳️</div></div>
    </div>
    <div style="background:var(--panel);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1.5px solid var(--border)">
      <div style="font-weight:900;color:var(--lego-red);margin-bottom:10px">💰 Spending</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="background:var(--bg3);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:22px;font-weight:900;color:var(--lego-green)">${totalSpend.toFixed(1)}</div>
          <div style="font-size:10px;color:var(--text3)">TOTAL KWD</div>
        </div>
        <div style="background:var(--bg3);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:22px;font-weight:900;color:var(--lego-blue)">${(totalSpend/S.rows.length).toFixed(1)}</div>
          <div style="font-size:10px;color:var(--text3)">AVG / SET</div>
        </div>
      </div>
    </div>
    <div style="background:var(--panel);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1.5px solid var(--border)">
      <div style="font-weight:900;color:var(--lego-blue);margin-bottom:10px">🎨 Sets by Theme</div>
      ${sorted.slice(0,20).map(([t,c])=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="min-width:140px;font-size:12px">${themeChip(t)}</span>
          <div style="flex:1;background:#eee;border-radius:4px;height:8px">
            <div style="width:${Math.round(c/maxC*100)}%;height:100%;border-radius:4px;background:${(THEME_COLORS[t]||{bg:'#888'}).bg}"></div>
          </div>
          <span style="font-weight:800;font-size:12px;min-width:24px;text-align:right;color:var(--lego-red)">${c}</span>
        </div>`).join('')}
    </div>
    <div style="background:var(--panel);border-radius:var(--radius);padding:14px;border:1.5px solid var(--border)">
      <div style="font-weight:900;color:var(--lego-green);margin-bottom:10px">🏪 Sets by Store</div>
      ${sortedS.map(([s,c])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0">
          ${storeChip(s)}
          <span style="font-weight:800;color:var(--text2)">${c} sets</span>
        </div>`).join('')}
    </div>`;
}

// ── EXPORT ────────────────────────────────────────────────
function exportXLSX() {
  // Simple CSV export
  const header = COLS.join(',');
  const csvRows = S.rows.map(r => COLS.map(c=>`"${String(r[c]||'').replace(/"/g,'""')}"`).join(','));
  const csv = [header, ...csvRows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'HSKW_LEGO_Export.csv';
  a.click();
  toast('📥 Exported as CSV!');
}

// ── CLOSE MODALS ──────────────────────────────────────────
document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target === document.getElementById('detailModal')) closeDetail();
});
document.getElementById('formModal').addEventListener('click', e => {
  if (e.target === document.getElementById('formModal')) closeForm();
});

// ── INIT ──────────────────────────────────────────────────
render();
</script>
