<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8"/>

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"
/>

<title>HMD LEGO Collection</title>

<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="style.css"/>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="app-shell">

<header class="topbar">

<button id="menuBtn" class="menu-btn">☰</button>

<div class="logo-brick">LEGO</div>

<div class="title-block">
<h1>HMD LEGO</h1>
</div>

<div class="searchbox">
🔎
<input id="search" placeholder="بحث سريع..."/>
</div>

</header>

<main>

<section class="table-card">

<div class="table-wrap">

<table id="dataTable"></table>

</div>

<div class="pager">

<button id="prevPage">‹</button>

<span id="pageNo">1</span>

<button id="nextPage">›</button>

</div>

</section>

</main>

</div>

<section id="detailView" class="detail-view" hidden>

<div class="detail-card">

<div class="detail-top">

<button id="backToTable" class="back-btn">
← العودة
</button>

<button id="detailEditBtn" class="edit-detail">
✏️ تعديل
</button>

</div>

<div class="set-art">

<img id="setImage"/>

</div>

<div class="detail-grid" id="detailGrid"></div>

</div>

</section>

<script src="app.js"></script>

</body>
</html>
