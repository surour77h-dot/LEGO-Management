<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSKW LEGO">
<title>HSKW LEGO Collection</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
#loadingScreen {
  position: fixed; inset: 0; background: #1a1a2e;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; gap: 20px;
}
#loadingScreen .brick { font-size: 64px; animation: bounce 0.8s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-16px); } }
#loadingScreen .msg { color: #FFD700; font-size: 18px; font-weight: 800; font-family: -apple-system, Arial, sans-serif; }
#loadingScreen .sub { color: #7a8a9a; font-size: 13px; font-family: -apple-system, Arial, sans-serif; }
#loadingBar { width: 200px; height: 6px; background: #ffffff20; border-radius: 10px; overflow: hidden; }
#loadingFill { height: 100%; background: #FFD700; border-radius: 10px; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen">
  <div class="brick">🧱</div>
  <div class="msg">HSKW LEGO</div>
  <div id="loadingBar"><div id="loadingFill"></div></div>
  <div class="sub" id="loadingMsg">جاري التحميل...</div>
</div>

<!-- App Shell -->
<div id="appShell" style="display:none">
  <div class="header">
    <div class="logo">
      <div class="logo-dot">🧱</div>
      <div>
        <div class="logo-text">HSKW LEGO</div>
        <div class="logo-sub">Collection Manager</div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-chip" id="hdr-total">—</div>
      <div class="stat-chip" id="hdr-sheets">9 Sheets</div>
    </div>
  </div>

  <div class="tab-scroll">
    <div class="tabs" id="tabsContainer"></div>
  </div>

  <div class="content" id="mainContent"></div>

  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalBox">
      <h2 id="modalTitle">Add Record <button class="modal-close" onclick="closeModal()">✕</button></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// Update loading bar
function setLoad(pct, msg) {
  document.getElementById('loadingFill').style.width = pct + '%';
  document.getElementById('loadingMsg').textContent = msg;
}
setLoad(10, 'تحميل البيانات...');
</script>

<!-- Data first (large file) -->
<script src="data.js" onload="setLoad(80, 'تهيئة التطبيق...')"></script>

<!-- App logic -->
<script src="app.js" onload="setLoad(100, 'جاهز!')"></script>

<script>
// Called after both scripts load — show app
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    if (typeof renderTabs === 'function') {
      renderTabs();
      renderContent();
      updateHeaderStats();
      document.getElementById('modalBg').addEventListener('click', function(e) {
        if (e.target === document.getElementById('modalBg')) closeModal();
      });
    }
  }, 300);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
